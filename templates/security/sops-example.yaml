# sops-example.yaml — example SOPS-encrypted secrets file
#
# SOPS (Secrets OPerationS) encrypts individual values in YAML/JSON while
# leaving keys in plaintext so diffs remain readable.
#
# Encrypt:  sops --encrypt --in-place secrets.yaml
# Decrypt:  sops --decrypt secrets.yaml > secrets.dec.yaml
# Edit:     sops secrets.yaml   (opens in $EDITOR, re-encrypts on save)
#
# Requirements:
#   - SOPS CLI:  https://github.com/getsops/sops
#   - Key provider configured in .sops.yaml (KMS, GCP KMS, age, or PGP)
#
# .sops.yaml example (repo root):
# ─────────────────────────────────
# creation_rules:
#   - path_regex: secrets\.yaml$
#     kms: arn:aws:kms:us-east-1:123456789012:key/<KEY_ID>
# ─────────────────────────────────

# ─── UNENCRYPTED form (before `sops --encrypt`) ───────────────────────────────
# This is what the file looks like before encryption — never commit this form.
# Shown here for documentation only.

# database:
#   host: postgres.internal
#   port: 5432
#   username: appuser
#   password: REPLACE_WITH_REAL_SECRET
#
# kafka:
#   bootstrap_servers: kafka.internal:9092
#   sasl_username: appuser
#   sasl_password: REPLACE_WITH_REAL_SECRET
#
# redis:
#   url: redis://redis.internal:6379
#   password: REPLACE_WITH_REAL_SECRET
#
# vault:
#   role_id: REPLACE_WITH_REAL_SECRET
#   secret_id: REPLACE_WITH_REAL_SECRET

# ─── ENCRYPTED form (after `sops --encrypt`) ──────────────────────────────────
# Values are replaced with ENC[...] ciphertext. Keys remain readable.

database:
  host: postgres.internal
  port: 5432
  username: appuser
  password: ENC[AES256_GCM,data:example==,iv:example==,tag:example==,type:str]

kafka:
  bootstrap_servers: kafka.internal:9092
  sasl_username: appuser
  sasl_password: ENC[AES256_GCM,data:example==,iv:example==,tag:example==,type:str]

redis:
  url: redis://redis.internal:6379
  password: ENC[AES256_GCM,data:example==,iv:example==,tag:example==,type:str]

vault:
  role_id: ENC[AES256_GCM,data:example==,iv:example==,tag:example==,type:str]
  secret_id: ENC[AES256_GCM,data:example==,iv:example==,tag:example==,type:str]

# SOPS metadata block — auto-generated by `sops --encrypt`, do not edit manually.
sops:
  kms:
    - arn: arn:aws:kms:us-east-1:123456789012:key/<KEY_ID>
      created_at: "2026-01-01T00:00:00Z"
      enc: EXAMPLE_ENCRYPTED_DATA_KEY==
      aws_profile: ""
  lastmodified: "2026-01-01T00:00:00Z"
  mac: ENC[AES256_GCM,data:example==,iv:example==,tag:example==,type:str]
  version: 3.8.1

