name: validate-repository

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run repository tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tooling/tests -p 'test_*.py'
      - name: Run validator
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tooling/scripts/validate_repository.py
