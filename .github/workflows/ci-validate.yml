name: Validate Engineering Standards Repository

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Repository tests and validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run validator unit tests
        run: python -m unittest discover -s tooling/tests -p 'test_*.py'

      - name: Validate repository
        run: python tooling/scripts/validate_repository.py

      - name: Install Python template test dependencies
        run: >-
          python -m pip install
          "pydantic>=2,<3"
          "pydantic-settings>=2,<3"
          "sqlalchemy>=2,<3"

      - name: Test Python adapter selection and production guards
        env:
          PYTHONPATH: stacks/python-fastapi/project-template
        run: >-
          python -m unittest discover
          -s stacks/python-fastapi/project-template/tests
          -p 'test_*.py'
