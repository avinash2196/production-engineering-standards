[tool.poetry]
name = "service-name"                    # Replace with actual service name
version = "0.1.0"
description = "FastAPI service template aligned with Production Engineering Standards"
authors = ["your-team <team@myorg.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
pydantic = "^2.7.0"
pydantic-settings = "^2.2.0"
structlog = "^24.1.0"

# Required by the database-backed local message adapter included in this template.
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
asyncpg = "^0.29.0"

# Production Kafka/PubSub, Redis, S3/GCS, managed-secret, security, and additional
# observability dependencies are added only by an approved Implementation Plan.

[tool.poetry.group.dev.dependencies]
ruff = "^0.4.0"
mypy = "^1.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
